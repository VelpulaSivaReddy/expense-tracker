<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories · ExpenseTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="page-header">
    <div>
      <div class="eyebrow">Organize</div>
      <h1>Categories</h1>
      <p class="desc">Default categories are shared by everyone. Add your own for anything else.</p>
    </div>
    <button class="btn btn-primary" id="add-category-btn" style="width:auto;">+ New Category</button>
  </div>

  <div class="card mb-16">
    <div class="card-header"><h3>Default Categories</h3></div>
    <div class="category-grid" id="default-category-grid">
      <div class="skeleton" style="height:70px;"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Your Categories</h3></div>
    <div class="category-grid" id="custom-category-grid">
      <div class="skeleton" style="height:70px;"></div>
    </div>
  </div>

  <!-- Add/Edit Category Modal -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="category-modal-title">New Category</h3>
        <button class="btn-icon" id="category-modal-close">&times;</button>
      </div>
      <form id="category-form" novalidate>
        <input type="hidden" name="categoryId">
        <div class="field">
          <label for="cat-name">Category name</label>
          <input type="text" id="cat-name" name="categoryName" placeholder="e.g. Pet Care" required>
          <div class="error-text"></div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cat-color">Color</label>
            <input type="color" id="cat-color" name="color" value="#22C55E" style="height:44px;padding:4px;">
          </div>
          <div class="field">
            <label for="cat-icon">Icon label</label>
            <input type="text" id="cat-icon" name="icon" placeholder="e.g. tag" value="tag">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="category-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" style="width:auto;">Save Category</button>
        </div>
      </form>
    </div>
  </div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/categories.js"></script>
</body>
</html>
