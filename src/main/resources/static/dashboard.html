<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · ExpenseTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="page-header">
    <div>
      <div class="eyebrow">Overview</div>
      <h1 id="greeting-heading">Dashboard</h1>
      <p class="desc">Here's how your spending looks right now.</p>
    </div>
    <div class="flex gap-8">
      <a href="/expenses.html?new=1" class="btn btn-primary" style="width:auto;">+ Add Expense</a>
      <button class="btn btn-outline" id="export-btn">Export</button>
    </div>
  </div>

  <div class="stat-grid" id="stat-grid">
    <div class="card stat-card"><div class="skeleton" style="height:90px;"></div></div>
    <div class="card stat-card"><div class="skeleton" style="height:90px;"></div></div>
    <div class="card stat-card"><div class="skeleton" style="height:90px;"></div></div>
    <div class="card stat-card"><div class="skeleton" style="height:90px;"></div></div>
  </div>

  <div class="content-grid">
    <div class="card">
      <div class="card-header">
        <h3>Monthly Expense Overview</h3>
        <a class="link" href="/reports.html">Full reports &rarr;</a>
      </div>
      <div class="chart-box"><canvas id="monthly-chart"></canvas></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Budget Progress</h3>
        <a class="link" href="/budgets.html">Manage &rarr;</a>
      </div>
      <div class="ring-row" id="ring-row">
        <div class="skeleton" style="width:96px;height:96px;border-radius:50%;"></div>
        <div class="skeleton" style="width:96px;height:96px;border-radius:50%;"></div>
        <div class="skeleton" style="width:96px;height:96px;border-radius:50%;"></div>
      </div>
    </div>
  </div>

  <div class="card mt-16">
    <div class="card-header">
      <h3>Recent Transactions</h3>
      <a class="link" href="/expenses.html">View all &rarr;</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Expense</th><th>Category</th><th>Payment</th><th style="text-align:right;">Amount</th></tr>
        </thead>
        <tbody id="recent-tbody">
          <tr><td colspan="5"><div class="skeleton" style="height:20px;"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/dashboard.js"></script>
</body>
</html>
