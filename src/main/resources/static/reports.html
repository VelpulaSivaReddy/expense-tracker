<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports · ExpenseTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="page-header">
    <div>
      <div class="eyebrow">Analyze</div>
      <h1>Reports &amp; Analytics</h1>
      <p class="desc">Trends, category breakdowns, and month-over-month comparisons.</p>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-outline" id="export-excel-btn">Export Excel</button>
      <button class="btn btn-outline" id="export-pdf-btn">Export PDF</button>
    </div>
  </div>

  <div class="stat-grid" id="comparison-stats">
    <div class="card stat-card"><div class="skeleton" style="height:70px;"></div></div>
    <div class="card stat-card"><div class="skeleton" style="height:70px;"></div></div>
    <div class="card stat-card"><div class="skeleton" style="height:70px;"></div></div>
    <div class="card stat-card"><div class="skeleton" style="height:70px;"></div></div>
  </div>

  <div class="content-grid">
    <div class="card">
      <div class="card-header"><h3>Monthly Expense Trend</h3></div>
      <div class="chart-box"><canvas id="monthly-trend-chart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>Category-wise Breakdown</h3></div>
      <div class="chart-box"><canvas id="category-pie-chart"></canvas></div>
    </div>
  </div>

  <div class="content-grid mt-16">
    <div class="card">
      <div class="card-header"><h3>Weekly Expenses</h3></div>
      <div class="chart-box sm"><canvas id="weekly-chart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>Top Spending Categories</h3></div>
      <div id="top-categories-list"><div class="skeleton" style="height:140px;"></div></div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/reports.js"></script>
</body>
</html>
