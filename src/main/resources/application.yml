server:
  port: 8080

spring:
  application:
    name: expensetracker

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    # IMPORTANT: JWT_SECRET must be provided via environment variable
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-file-size: 10485760 # 10MB in bytes
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:Expense Tracker}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_EXPIRATION:30}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8080}

logging:
  level:
    com.learningsp: INFO
    org.springframework.security: WARN
